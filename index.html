/* Estrutura
   Três faixas lado a lado, como na loja: o menu (terracota), a lista (papel) e o painel de edição.
   O painel pega a cor do que está sendo editado (tema do produto, tema do mês, etc.).
   A linha selecionada tem a mesma cor do painel, então parece sair da lista e abrir o painel. */
:root{
  --paper:#1F1513; --ink:#D9DDD2; --faint:#9AA397; --fio:#4A4F45;
  --terra:#7B402E; --azul:#5982AB; --oliva:#3D3F34; --salva:#889186; --marrom:#5C493C;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--paper:#CDD3C8; --ink:#1F1513; --faint:#4A5146; --fio:#8E968A; color-scheme:light}
}
:root[data-theme="light"]{--paper:#CDD3C8; --ink:#1F1513; --faint:#4A5146; --fio:#8E968A; color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:90}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;margin:0;border-radius:0}
button{cursor:pointer}
a{color:inherit}
p,h1,h2,h3{margin:0}
h1,h2,h3{font-weight:600;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.peq{font-size:.85rem;color:var(--faint)}
.num{font-variant-numeric:tabular-nums}

/* logotipo em letras soltas */
.marca{display:flex;flex-wrap:wrap;align-items:flex-start;--h:22px}
.L{display:block;flex:none;height:var(--h);aspect-ratio:var(--r);margin-left:calc(var(--h)*var(--g)/184);fill:currentColor;overflow:visible;transform-origin:50% 90%;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.marca .L:first-child{margin-left:0}
.L:hover{transform:translateY(calc(var(--h)*-.07)) rotate(-5deg)}
.L:nth-child(even):hover{transform:translateY(calc(var(--h)*-.07)) rotate(5deg)}
.w{display:inline-block;white-space:nowrap}
.letra{display:inline-block;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.letra:hover{transform:translateY(-.09em) rotate(-4deg)}
.letra:nth-child(even):hover{transform:translateY(-.09em) rotate(4deg)}

/* formas Warja */
.gl{display:block;width:var(--gs,64px);height:var(--gs,64px);fill:none;stroke:currentColor;stroke-width:var(--sw,2.5px);stroke-linejoin:miter;stroke-linecap:butt;overflow:visible;flex:none}
.gl *{vector-effect:non-scaling-stroke}
.gl .f{fill:currentColor}
.gl .o1{fill:currentColor;fill-opacity:.6}
.gl .o2{fill:currentColor;fill-opacity:.3}
.gl .k{fill:var(--bg,var(--paper))}
.gl .d{stroke-dasharray:3 3}
.gl .a,.gl .b{transform:none;transition:transform .45s cubic-bezier(.34,1.56,.64,1);transition-delay:calc(var(--k,0)*40ms);transform-box:fill-box;transform-origin:center}
:is(.h:hover,.h:focus-visible,.h.sel,.h[aria-pressed="true"],.h[aria-current="page"]) .gl .a{transform:var(--t,none)}
:is(.h:hover,.h:focus-visible,.h.sel,.h[aria-pressed="true"],.h[aria-current="page"]) .gl .b{transform:var(--t,none)}
.fila{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));--gs:26px;--sw:1.8px;--c:var(--n);max-width:calc(var(--n)*(var(--gs) + 8px))}
.fila::before{content:"";position:absolute;left:calc(50%/var(--n));right:calc(100% - (var(--c) - .5)*100%/var(--n));top:calc(var(--gs)/2);border-top:2px dashed currentColor;opacity:.5}
.fila .gw{position:relative;display:flex;justify-content:center}
.fila .gw .gl{background:var(--bg,var(--paper));padding:0 3px;box-sizing:content-box}

/* botões e campos */
.btn{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;font-weight:500;line-height:1.2;padding:.65rem 1.05rem;background:transparent;color:inherit;border:2px solid currentColor;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg,var(--paper))}
.btn[aria-pressed="true"],.btn.on{background:var(--ink);color:var(--bg,var(--paper))}
.btn[aria-pressed="true"]:hover{background:transparent;color:inherit}
.btn.peq-b{padding:.45rem .8rem;font-size:.82rem}

.grupo{display:inline-flex;flex-wrap:wrap;border:2px solid currentColor}
.grupo button{border:0;border-right:2px solid currentColor;padding:.5rem .9rem;font-size:.85rem;font-weight:500;background:transparent}
.grupo button:last-child{border-right:0}
.grupo button:hover{background:var(--ink);color:var(--paper)}
.grupo button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

input,select,textarea{display:block;width:100%;background:transparent;border:2px solid currentColor;padding:.6rem .75rem;font-size:.95rem}

.st{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;font-size:.88rem}

/* aplicação */
.app{display:grid;grid-template-columns:15.5rem minmax(0,1fr);min-height:100vh;min-height:100dvh}

/* menu lateral */
.lado{align-self:start;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--terra);color:#EEF0E9;display:flex;flex-direction:column;padding:1.4rem 0 1.1rem;padding-left:env(safe-area-inset-left,0px);z-index:80}

.lado .sub-m{padding:.55rem 1.25rem 1.6rem;font-size:.82rem;opacity:.8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.9rem;width:100%;background:transparent;border:0;text-align:left;padding:.62rem 1.25rem;font-size:1.02rem;font-weight:500;--gs:30px;--sw:2px;--bg:var(--terra)}
.nav button:hover{background:rgba(0,0,0,.2)}
.nav button[aria-current="page"]{background:var(--paper);color:var(--ink);--bg:var(--paper)}
.nav .n{margin-left:auto;font-size:.8rem;min-width:1.4rem;text-align:center;padding:.05rem .35rem;border:2px solid currentColor;line-height:1.3}
.lado-f{margin-top:auto;padding:1.5rem 1.25rem 0;display:flex;flex-direction:column;gap:.75rem;font-size:.82rem}
.lado-f select{padding:.45rem .6rem;font-size:.85rem}
.lado-f .btn:hover{background:#EEF0E9;color:var(--terra)}
.lado-f .linha-f{display:flex;gap:.5rem;flex-wrap:wrap}
.lado-f a.btn{justify-content:center}
.exemplo{opacity:.8;line-height:1.35}

/* conteúdo */
.conteudo{min-width:0}
.mtopo{display:none}
.main{display:grid;grid-template-columns:minmax(0,1fr);--pbg:var(--marrom);--pink:#EEF0E9}
.main.com-painel{grid-template-columns:minmax(0,1fr) min(30rem,38vw)}
.tela{min-width:0;padding-block:clamp(1.5rem,3vw,2.5rem) 4rem}
.pad{padding-inline:1.5rem}
.cab{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:flex-end;margin-bottom:1.75rem}
.cab-t{display:flex;align-items:center;gap:1.1rem;min-width:0}
.cab-t .gl{--gs:56px;--sw:2.5px}
.t1{font-size:clamp(2.2rem,4.6vw,3.6rem)}
.t3{font-size:1.5rem;margin-bottom:.4rem}
.lead{max-width:58ch;color:var(--faint);margin-top:.35rem}
.bloco-t{margin-top:clamp(2.5rem,5vw,4rem)}

/* faixas de resumo */
.bandas{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));margin-bottom:0}
.banda{display:flex;flex-direction:column;gap:.6rem;min-height:13.5rem;padding:1.5rem 1.5rem 1.25rem;background:var(--bg);color:var(--ink);border:0;text-align:left;width:100%}
.banda .rot{font-size:.95rem}
.banda .big{font-size:clamp(2.6rem,4.6vw,4rem);font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.vai{display:flex;align-items:center;gap:.6rem;margin-top:auto;padding-top:1rem;font-size:.92rem;font-weight:500}
.vai svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:miter;transform:rotate(-90deg);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
:is(.banda,.linha.ir):hover .vai svg,:is(.banda,.linha.ir):focus-visible .vai svg{transform:rotate(-90deg) translateY(5px)}
.banda:hover{filter:brightness(1.07)}

/* o ano em letras */
.ano{container-type:inline-size;padding-inline:1.5rem}
.ano-l{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;margin-top:1.25rem}
.ano-l + .ano-l{margin-top:1.5rem}
.mc{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;min-width:0}
.mc .L{margin-left:0;--h:calc(var(--hmax)*var(--f));opacity:calc(.25 + .75*var(--on))}
.mc .v{font-size:.82rem;line-height:1.2}
.mc .v b{display:block;font-weight:600;font-size:.95rem}
.ano{--hmax:min(150px,calc(100cqw/6/.6))}

/* listas */
.lista{display:flex;flex-direction:column}
.linha{position:relative;display:grid;grid-template-columns:var(--cols);gap:.2rem 1rem;align-items:center;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-top:1px solid var(--fio);padding:.85rem 1.5rem .85rem 2rem;font-size:.95rem;line-height:1.35}
.lista > .linha:last-child{border-bottom:1px solid var(--fio)}
button.linha:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.linha[aria-selected="true"],button.linha[aria-selected="true"]:hover{background:var(--pbg);color:var(--pink);border-color:var(--pbg);--bg:var(--pbg)}
.linha[aria-selected="true"] + .linha{border-top-color:var(--pbg)}
.linha > *{min-width:0}
.linha .tit{display:block;font-weight:600;overflow-wrap:anywhere}
.linha .sub{display:block;font-size:.82rem;opacity:.72;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .fila{margin-top:.4rem;--bg:var(--paper)}
.linha[aria-selected="true"] .fila{--bg:var(--pbg)}
.linha .tira{position:absolute;left:0;top:0;bottom:0;width:.55rem;background:var(--tc)}
.linha .dir{text-align:right;font-variant-numeric:tabular-nums}
.linha.h0{cursor:default;font-size:.8rem;color:var(--faint);border-top:0;padding-block:.35rem}
.linha.ir{padding-left:1.5rem}
.linha.ir .vai{margin:0;padding:0;justify-content:flex-end}
.so-m{display:none!important}
.filtros{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;margin-bottom:1.25rem}
.filtros input{max-width:18rem;padding:.5rem .7rem}
.nota{margin-top:1rem;font-size:.85rem;color:var(--faint);max-width:62ch}
.vazio{padding:2rem 1.5rem;color:var(--faint)}

/* meses da assinatura */
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}
.cm{display:flex;flex-direction:column;gap:.5rem;min-height:12rem;padding:1.1rem 1rem 1rem;background:var(--bg);color:var(--ink);border:0;text-align:left;width:100%;position:relative}
.cm .marca{--h:54px}
.cm .marca .L{margin-left:0}
.cm .nm{font-size:1.05rem;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.cm .st{margin-top:auto}
.cm .dt{font-size:.8rem;opacity:.8}
.cm[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.cm.sem{opacity:.55}

/* painel */
.painel{align-self:start;background:var(--pbg);color:var(--pink);--bg:var(--pbg);--ink:var(--pink);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:1.5rem;padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
.painel:focus{outline:none}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.1rem}
.p-t{font-size:1.9rem;line-height:1.05;overflow-wrap:anywhere}
.p-s{font-size:.9rem;opacity:.8;margin-top:.35rem}
.bloco{display:flex;flex-direction:column;gap:.85rem;margin-top:1.75rem}
.bloco > h3{font-size:1rem}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.campos .todo{grid-column:1/-1}
.mod-l{display:flex;flex-direction:column;gap:.5rem}
.mod-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center}
.mod-i .gl{--gs:34px;--sw:2px}
.mod-i input{padding:.45rem .6rem;font-size:.9rem}
.mini{display:flex;gap:.25rem}
.mini button{width:2rem;height:2rem;display:grid;place-items:center;border:2px solid currentColor;background:transparent;padding:0;font-size:.95rem;line-height:1}
.mini button:hover{background:var(--ink);color:var(--bg)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr));gap:.4rem}
.pick button{display:grid;place-items:center;padding:.4rem;border:2px solid transparent;background:transparent}
.pick button:hover,.pick button:focus-visible{border-color:currentColor}
.pick .gl{--gs:34px;--sw:2px}
.acesso{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center}
.acesso .gl{--gs:32px;--sw:2px}
.acesso .tt{font-size:.92rem;line-height:1.25}
.linha-p{display:flex;flex-wrap:wrap;gap:.6rem}
.tl{display:flex;flex-direction:column;gap:.7rem;font-size:.92rem}
.tl .e{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;align-items:start}
.tl .e svg{width:14px;height:14px;margin-top:.25rem}
.tl .e small{display:block;opacity:.7;font-size:.8rem}
.conf{display:flex;flex-direction:column;gap:.6rem;padding:.9rem;border:2px solid currentColor}
.dados{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.92rem}
.dados dt{opacity:.72}.dados dd{margin:0;overflow-wrap:anywhere}
.veu{display:none}

/* ajustes */
.aj{max-width:44rem;display:flex;flex-direction:column;gap:clamp(2rem,4vw,3rem)}
.aj section{display:flex;flex-direction:column;gap:.9rem}
.aj .grupo{align-self:flex-start}
.aj h2{font-size:1.55rem;display:flex;align-items:center;gap:.8rem}
.aj h2 .gl{--gs:34px;--sw:2px}
.perm{display:grid;grid-template-columns:minmax(0,1fr) 5.5rem 5.5rem;font-size:.92rem;align-items:center}
.perm > *{padding:.5rem 0;border-top:1px solid var(--fio)}
.perm .c{text-align:center}
.perm .hd{font-size:.8rem;color:var(--faint);border-top:0}
.perm svg{width:14px;height:14px}
.pessoa-eq{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-top:1px solid var(--fio)}

/* área da aluna */
a.linha{text-decoration:none}
a.linha:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.banda .fila{--gs:30px;margin-block:.2rem}
.banda .tt2{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.aula{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4rem .85rem;align-items:start}
.aula .gl{--gs:40px;--sw:2px}
.aula .tt{font-size:.95rem;line-height:1.3}
.aula .tt b{display:block;font-size:1rem}
.aula .linha-p{grid-column:2}
.faixa-msg{padding:1rem 1.5rem;background:var(--marrom);color:#EEF0E9;max-width:44rem}

/* entrar */
.login{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:auto}
.login .fx{display:grid;grid-template-columns:repeat(4,1fr);position:relative;min-height:100%}
.login .fx i{display:block}
.login .fx .marca{position:absolute;left:1.5rem;right:1.5rem;bottom:1.25rem;color:#EEF0E9;--h:clamp(26px,3.4vw,52px)}
.login form{display:flex;flex-direction:column;gap:1rem;justify-content:center;padding:2rem clamp(1.25rem,5vw,4rem);max-width:34rem}
.login h1{font-size:clamp(2.4rem,5vw,3.6rem);margin-bottom:.5rem}
.login .linha-f{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}

/* aviso */
.toast{position:fixed;inset:auto auto calc(1.25rem + env(safe-area-inset-bottom,0px)) 50%;margin:0;overflow:visible;transform:translate(-50%,140%);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border:2px solid var(--ink);font-size:.9rem;line-height:1.45;padding:.8rem 1.1rem;max-width:min(92vw,460px);transition:transform .3s,opacity .2s}
.toast.on{transform:translate(-50%,0);opacity:1}

/* perfil: operação não vê dinheiro nem ajustes */
body[data-perfil="op"] .so-adm{display:none!important}
body[data-perfil="adm"] .so-op{display:none!important}

@media(max-width:1099px){
  .main.com-painel{grid-template-columns:minmax(0,1fr)}
  .painel{position:fixed;inset:0 0 0 auto;width:min(100%,30rem);height:auto;z-index:70}
  .veu{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5)}
  .main.com-painel .veu{display:block}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lado{position:fixed;inset:0 auto 0 0;width:min(18rem,86vw);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:85}
  .lado.on{transform:none}
  .mtopo{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--paper);align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1rem;padding-left:max(1rem,env(safe-area-inset-left,0px));padding-right:max(1rem,env(safe-area-inset-right,0px))}
  .mtopo .marca{--h:22px}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .fx{min-height:9rem}
  .pad,.linha{padding-inline:1rem}
  .linha{padding-left:1.4rem}
  .linha.ir{padding-left:1rem}
  .ano{padding-inline:1rem}
}
@media(max-width:700px){
  .hm{display:none!important}
  .so-m{display:inline!important}
  .linha .sub.so-m{display:block!important}
  .linha{grid-template-columns:minmax(0,1fr) auto!important}
  .linha.h0{display:none}
  .campos{grid-template-columns:1fr}
  .cab-t .gl{--gs:44px}
  .perm{grid-template-columns:minmax(0,1fr) 4rem 4rem}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>


<div class="app" id="app">
  <aside class="lado" id="lado" aria-label="Menu da área de gerenciamento">
    <div class="marca" id="logo-lado" role="img" aria-label="pretaletrada"></div>
    <p class="sub-m" id="sub-m">gerenciamento</p>
    <nav class="nav" id="nav" aria-label="Telas"></nav>
    <div class="lado-f">
      <label>ver como
        <select id="perfil">
          <option value="adm">Cíntia, administradora</option>
          <option value="dona">Preta Letrada, dona</option>
          <option value="op">Maria, operação</option>
          <option value="aluna">Bruna, aluna</option>
        </select>
      </label>
      <p class="exemplo">Dados de exemplo. Nada daqui é real nem é enviado.</p>
      <div class="linha-f">
        <button class="btn peq-b" id="tema" type="button">Usar tema claro</button>
        <button class="btn peq-b" id="sair" type="button">Sair</button>
      </div>
      <a class="btn peq-b" href="index.html">Ver a loja</a>
    </div>
  </aside>

  <div class="conteudo">
    <header class="mtopo">
      <div class="marca" id="logo-m" role="img" aria-label="pretaletrada"></div>
      <button class="btn peq-b" id="abrir-menu" type="button" aria-expanded="false" aria-controls="lado">Menu</button>
    </header>
    <div class="main" id="main">
      <section class="tela" id="tela" aria-live="polite"></section>
      <aside class="painel" id="painel" role="complementary" aria-label="Edição" tabindex="-1" hidden></aside>
      <div class="veu" id="veu"></div>
    </div>
  </div>
</div>

<div class="login" id="login">
  <div class="fx" aria-hidden="true"><i style="background:#7B402E"></i><i style="background:#5982AB"></i><i style="background:#3D3F34"></i><i style="background:#889186"></i><div class="marca" id="logo-login"></div></div>
  <form id="form-login">
    <h1 id="h-login" aria-label="entrar">entrar</h1>
    <p class="peq">Área de gerenciamento da Preta Letrada.</p>
    <label>E-mail<input type="email" id="lg-email" autocomplete="username" placeholder="voce@pretaletrada.com"></label>
    <label>Senha<input type="password" id="lg-senha" autocomplete="current-password" placeholder="••••••••"></label>
    <div class="linha-f">
      <button class="btn on" type="submit">Entrar</button>
      <button class="btn" type="button" id="esqueci">Esqueci a senha</button>
    </div>
    <p class="peq">Protótipo: qualquer e-mail e senha entram.</p>
  </form>
</div>

<div class="toast" id="toast" popover="manual" role="status"></div>

<script>
/* ============================================================
   Protótipo da área de gerenciamento. Os dados abaixo são de exemplo.
   Na plataforma real, cada tela lê e grava no servidor (Node no Render)
   e o status dos pagamentos vem do Mercado Pago.
   ============================================================ */

  PROD.map(p=>{
    const t=TEMAS[p.tema];
    return `<button class="linha" type="button" data-sel="produto" data-id="${p.id}" aria-selected="${E.sel==='produto:'+p.id}" style="--cols:minmax(0,2.6fr) 5rem 5rem 4.5rem 8rem;--tc:${t.bg}"><i class="tira"></i><span><span class="tit">${esc(p.titulo)}</span><span class="sub"><span class="so-m">${p.tipo}<span class="so-adm"> · ${BRL.format(p.preco)}</span> · </span>${t.nome}</span>${fila(p.itens)}</span><span class="hm">${p.tipo}</span><span class="dir hm so-adm">${BRL.format(p.preco)}</span><span class="dir hm">${p.vendas}</span>${st(p.status)}</button>`;

function produtos(){

    <div class="h" style="--gs:38px;--sw:1.8px">${fila(p.itens)}</div>
    <div class="bloco"><div class="campos">
      <label class="todo">Título<input data-bind="titulo" value="${esc(p.titulo)}"></label>
      <label>Tipo<select data-bind="tipo"><option value="curso" ${p.tipo==='curso'?'selected':''}>curso</option><option value="guia" ${p.tipo==='guia'?'selected':''}>guia em pdf</option></select></label>
      <label>Tema<select data-bind="tema">${Object.keys(TEMAS).map(k=>`<option value="${k}" ${p.tema===k?'selected':''}>${TEMAS[k].nome}</option>`).join('')}</select></label>
      <label class="so-adm">Preço em reais<input type="number" min="0" step="1" data-bind="preco" value="${p.preco}"></label>
      <label>Situação<select data-bind="status"><option value="publicado" ${p.status==='publicado'?'selected':''}>publicado</option><option value="rascunho" ${p.status==='rascunho'?'selected':''}>rascunho</option></select></label>
      <label class="todo">Texto de apresentação<textarea data-bind="desc">${esc(p.desc)}</textarea></label>
    </div></div>
    <div class="bloco"><h3>módulos</h3><div class="mod-l">${mods||'<p class="p-s">Nenhum módulo ainda.</p>'}</div>
      <div><button class="btn peq-b" type="button" data-act="add-mod" ${p.itens.length>=6?'disabled':''}>Adicionar módulo</button></div>
      <div id="pick" hidden class="pick" role="group" aria-label="Escolha a forma do módulo">${Object.keys(G).map(k=>`<button type="button" class="h" data-act="forma" data-g="${k}" aria-label="forma ${k}">${gl(k)}</button>`).join('')}</div>
      ${p.itens.length>=6?'<p class="p-s">A loja mostra até seis módulos por produto.</p>':''}

/* ---------- assinatura ---------- */

  const c = k=>MES.filter(m=>m.status===k).length;
  const cels = MES.map((m,i)=>{
    const t=TEMAS[m.tema];
    return `<button class="cm" type="button" data-sel="mes" data-id="${i}" aria-pressed="${E.sel==='mes:'+i}" style="--bg:${t.bg};--ink:${t.ink}"><span class="marca" aria-hidden="true">${letraSvg(i)}</span><span class="nm">${esc(m.nome)}</span><span class="dt">${m.status==='vazio'?'sem data':fdata(m.data)+(m.data.startsWith('2027')?' 2027':'')}</span>${st(m.status)}</button>`;
  }).join('');
  return `${cabecalho('assinatura','<button class="btn so-adm" type="button" data-ir="ajustes">Preço e nome</button>')}
  <div class="pad" style="margin-bottom:1.5rem"><p class="lead" style="margin:0"><b>${esc(CFG.assinatura.nome)}</b> · <span class="so-adm">${BRL.format(CFG.assinatura.preco)} por mês · </span>${ATIVAS} assinantes ativas</p>
  <p class="peq" style="margin-top:.35rem">${c('publicado')} publicados, ${c('agendado')} agendado, ${c('rascunho')} em rascunho, ${c('vazio')} sem conteúdo. Cada letra é um mês do primeiro ano.</p></div>
  <div class="mg" id="meses">${cels}</div>`;
}

  const m=MES[i], t=TEMAS[m.tema];
  const arq=m.arquivos.map((a,k)=>`<div class="acesso" style="grid-template-columns:minmax(0,1fr) auto"><span class="tt">${esc(a)}</span><button class="btn peq-b" type="button" data-act="tira-arq" data-i="${k}">Remover</button></div>`).join('');
  abrirPainel(`
    <div class="p-top"><div><h2 class="p-t">${esc(m.nome)}</h2><p class="p-s">mês ${i+1} · ${st(m.status)}</p></div><button class="btn peq-b" type="button" data-act="fechar">Fechar</button></div>
    <div class="h" style="--gs:56px;--sw:2.5px">${gl(m.g)}</div>
    <div class="bloco"><div class="campos">
      <label class="todo">Tema do mês<input data-bind="nome" value="${esc(m.nome)}"></label>
      <label>Cor<select data-bind="tema">${Object.keys(TEMAS).map(k=>`<option value="${k}" ${m.tema===k?'selected':''}>${TEMAS[k].curto}</option>`).join('')}</select></label>
      <label>Situação<select data-bind="status"><option value="vazio" ${m.status==='vazio'?'selected':''}>sem conteúdo</option><option value="rascunho" ${m.status==='rascunho'?'selected':''}>rascunho</option><option value="agendado" ${m.status==='agendado'?'selected':''}>agendado</option><option value="publicado" ${m.status==='publicado'?'selected':''}>publicado</option></select></label>
      <label class="todo">Data de liberação<input type="date" data-bind="data" value="${m.data}"></label>
      <label class="todo">Resumo<textarea data-bind="desc">${esc(m.desc)}</textarea></label>
    </div></div>
    <div class="bloco"><h3>arquivos do mês</h3>${arq||'<p class="p-s">Nenhum arquivo ainda.</p>'}

    <div class="bloco"><div class="linha-p"><button class="btn on" type="button" data-act="salvar-mes">Salvar</button><button class="btn" type="button" data-act="fechar">Cancelar</button></div><p class="p-s">Quem assina recebe um e-mail no dia da liberação.</p></div>`, t.bg, t.ink, 'mes:'+i);
}

/* ---------- pessoas ---------- */
function filtraPessoas(){
  const q=norm(E.busca);
  return PESSOAS.filter(p=>{
    const e=p.ass?p.ass.e:'nenhuma';
    const okF = E.fp==='todas' || (E.fp==='assinantes'&&e==='ativa') || (E.fp==='atrasadas'&&e==='atrasada') || (E.fp==='canceladas'&&e==='cancelada') || (E.fp==='compras'&&!p.ass);
    return okF && (!q || norm(p.nome+' '+p.email).includes(q));
  });
}
function linhasPessoas(){
  const l=filtraPessoas();
  if(!l.length) return '<p class="vazio">Ninguém encontrado. Tire o filtro ou mude a busca.</p>';
  return `<div class="linha h0" style="--cols:minmax(0,2fr) minmax(0,1.3fr) 8rem 4.5rem"><span>pessoa</span><span class="hm">compras</span><span>assinatura</span><span class="dir hm">desde</span></div>`+
  l.map(p=>{
    const e=p.ass?p.ass.e:'nenhuma';
    const desde=p.ass?p.ass.desde:(p.compras[0]?p.compras[0][1]:'2026-10-01');
    return `<button class="linha ir" type="button" data-sel="pessoa" data-id="${p.id}" aria-selected="${E.sel==='pessoa:'+p.id}" style="--cols:minmax(0,2fr) minmax(0,1.3fr) 8rem 4.5rem"><span><span class="tit">${esc(p.nome)}</span><span class="sub">${esc(p.email)}</span></span><span class="hm sub" style="opacity:1;font-size:.9rem">${p.compras.length?p.compras.length+(p.compras.length>1?' compras':' compra'):'nenhuma'}</span>${st(e)}<span class="dir hm sub">${fdata(desde)}</span></button>`;
  }).join('');
}
function filtrosPessoas(){
  const f=[['todas','Todas'],['assinantes','Assinantes'],['atrasadas','Atrasadas'],['canceladas','Canceladas'],['compras','Só compras']];
  return `<div class="filtros pad"><div class="grupo" role="group" aria-label="Filtrar pessoas">${f.map(([k,n])=>`<button type="button" data-fp="${k}" aria-pressed="${E.fp===k}">${n}</button>`).join('')}</div><input type="search" id="busca" placeholder="Buscar por nome ou e-mail" aria-label="Buscar por nome ou e-mail" value="${esc(E.busca)}"></div>`;
}
function pessoas(){
  return `${cabecalho('pessoas','<p class="peq">quem comprou ou assina</p>')}${filtrosPessoas()}<div class="lista" id="lista">${linhasPessoas()}</div><p class="nota pad">Exemplo com 16 cadastros. Na plataforma real aparecem todas as pessoas, com busca e páginas.</p>`;
}
function painelPessoa(p){
  const e=p.ass?p.ass.e:'nenhuma';
  const todos=[...PROD.filter(x=>x.status==='publicado').map(x=>({id:x.id,t:x.titulo,g:x.itens[0].g})),{id:'assinatura',t:CFG.assinatura.nome,g:'ankh'}];
  const acessos=todos.map(a=>{ const tem=p.acessos.has(a.id); return `<div class="acesso h">${gl(a.g)}<span class="tt">${esc(a.t)}</span><button class="btn peq-b" type="button" data-act="acesso" data-id="${a.id}" aria-pressed="${tem}">${tem?'com acesso':'sem acesso'}</button></div>`; }).join('');
  const hist=PAG.filter(x=>x.pessoa===p.id).slice(0,5).map(x=>`<div class="acesso" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="peq" style="color:inherit;opacity:.75">${fdata(x.data)}</span><span class="tt">${esc(nomeProd(x.prod))}</span>${st(x.status)}</div>`).join('');
  abrirPainel(`
    <div class="p-top"><div><h2 class="p-t">${esc(p.nome)}</h2><p class="p-s">${esc(p.email)}</p></div><button class="btn peq-b" type="button" data-act="fechar">Fechar</button></div>
    <dl class="dados"><dt>assinatura</dt><dd>${st(e)}</dd>${p.ass?`<dt>desde</dt><dd>${fdata(p.ass.desde)} 2026</dd><dt>pagamento</dt><dd>${p.ass.metodo}</dd>`:''}${p.ass&&p.ass.canc?`<dt>cancelou em</dt><dd>${fdata(p.ass.canc)}</dd>`:''}</dl>
    <div class="bloco"><h3>acessos</h3>${acessos}</div>
    <div class="bloco"><h3>pagamentos</h3>${hist||'<p class="p-s">Nenhum pagamento.</p>'}</div>
    <div class="bloco"><div class="linha-p"><button class="btn" type="button" data-act="reenviar">Reenviar e-mail de acesso</button><button class="btn" type="button" data-act="senha">Redefinir senha</button></div>
      <div id="zona-cancel">${p.ass&&(p.ass.e==='ativa'||p.ass.e==='atrasada')?'<button class="btn" type="button" data-act="cancelar">Cancelar assinatura</button>':''}</div></div>`, '#5C493C', '#EEF0E9', 'pessoa:'+p.id);
}

/* ---------- pagamentos ---------- */
function filtraPag(){
  return PAG.filter(x=> E.fg==='todos' || (E.fg==='atencao'&&(x.status==='pendente'||x.status==='recusado')) || E.fg===x.status);
}
function linhasPag(){
  const l=filtraPag();
  if(!l.length) return '<p class="vazio">Nenhum pagamento nesse filtro.</p>';
  return `<div class="linha h0" style="--cols:3.2rem minmax(0,1.7fr) minmax(0,1.5fr) 4.5rem 5rem 7.5rem"><span>data</span><span>pessoa</span><span class="hm">produto</span><span class="hm">forma</span><span class="dir so-adm hm">valor</span><span>situação</span></div>`+
  l.map(x=>`<button class="linha ir" type="button" data-sel="pag" data-id="${x.id}" aria-selected="${E.sel==='pag:'+x.id}" style="--cols:3.2rem minmax(0,1.7fr) minmax(0,1.5fr) 4.5rem 5rem 7.5rem"><span class="num hm">${fdata(x.data)}</span><span><span class="tit">${esc(pessoa(x.pessoa).nome)}</span><span class="sub so-m">${fdata(x.data)} · ${esc(nomeProd(x.prod))}<span class="so-adm"> · ${BRL.format(x.valor)}</span></span></span><span class="sub hm" style="opacity:1;font-size:.9rem;white-space:normal">${esc(nomeProd(x.prod))}</span><span class="hm">${x.metodo}</span><span class="dir so-adm hm">${BRL.format(x.valor)}</span>${st(x.status)}</button>`).join('');
}
function pagamentos(){
  const f=[['todos','Todos'],['aprovado','Aprovados'],['atencao','Para resolver'],['reembolsado','Reembolsados']];
  return `${cabecalho('pagamentos','<p class="peq">atualizado pelo Mercado Pago</p>')}<div class="filtros pad"><div class="grupo" role="group" aria-label="Filtrar pagamentos">${f.map(([k,n])=>`<button type="button" data-fg="${k}" aria-pressed="${E.fg===k}">${n}</button>`).join('')}</div></div><div class="lista" id="lista">${linhasPag()}</div>`;
}
function painelPag(x){
  const p=pessoa(x.pessoa);
  const ev=[[`pedido criado`,x.data]];
  ev.push([x.metodo==='pix'?'código pix gerado':'cartão enviado ao Mercado Pago',x.data]);
  if(x.status==='aprovado') ev.push(['pagamento aprovado',x.data],['e-mail de acesso enviado',x.data]);
  if(x.status==='pendente') ev.push(['aguardando o pagamento do pix','']);
  if(x.status==='recusado') ev.push(['cartão recusado pelo banco',x.data],['e-mail de aviso enviado',x.data]);
  if(x.status==='reembolsado') ev.push(['pagamento aprovado',x.data],['reembolsado',x.data],['acesso removido',x.data]);
  const tl=ev.map(([t,d],i)=>{ const ultimo=i===ev.length-1; return `<div class="e"><svg viewBox="0 0 16 16" aria-hidden="true">${ST[ultimo&&x.status!=='aprovado'?x.status:'aprovado'].s}</svg><span>${t}${d?`<small>${fdata(d)}</small>`:''}</span></div>`; }).join('');
  abrirPainel(`
    <div class="p-top"><div><h2 class="p-t">${esc(p.nome)}</h2><p class="p-s">${esc(nomeProd(x.prod))}</p></div><button class="btn peq-b" type="button" data-act="fechar">Fechar</button></div>
    <dl class="dados"><dt>situação</dt><dd>${st(x.status)}</dd><dt class="so-adm">valor</dt><dd class="so-adm">${BRL.format(x.valor)}</dd><dt>forma</dt><dd>${x.metodo}</dd><dt>data</dt><dd>${fdata(x.data)} 2026</dd><dt>código</dt><dd class="num">${x.id}</dd></dl>
    <div class="bloco"><h3>o que aconteceu</h3><div class="tl">${tl}</div></div>
    <div class="bloco"><div class="linha-p">
      <button class="btn" type="button" data-act="ver-pessoa" data-id="${p.id}">Ver pessoa</button>
      <button class="btn" type="button" data-act="reenviar" ${x.status==='aprovado'?'':'disabled'}>Reenviar acesso</button></div>
      <div id="zona-reemb" class="so-adm">${x.status==='aprovado'?'<button class="btn" type="button" data-act="reembolsar">Reembolsar</button>':''}</div>
      <p class="p-s">O status muda sozinho quando o Mercado Pago avisa o servidor.</p></div>`, '#3D3F34', '#EEF0E9', 'pag:'+x.id);
}

/* ---------- área da aluna ---------- */
const visto = p => p.itens.filter((_,i)=>VISTO.has(p.id+':'+i)).length;
function aCursos(){
  const a=A();
  const meus=PROD.filter(p=>a.acessos.has(p.id));
  const outros=PROD.filter(p=>!a.acessos.has(p.id)&&p.status==='publicado');
  const bandas=meus.map(p=>{
    const t=TEMAS[p.tema], c=p.tipo==='curso';
    return `<button class="banda h" type="button" data-sel="curso" data-id="${p.id}" style="--bg:${t.bg};--ink:${t.ink}"><span class="rot">${c?'curso':'guia em pdf'}</span><span class="tt2">${esc(p.titulo)}</span>${fila(p.itens)}<span class="rot num">${visto(p)} de ${p.itens.length} ${c?'módulos vistos':'partes lidas'}</span>${vai('abrir')}</button>`;
  }).join('');
  return `${cabecalho('a-cursos',`<p class="peq">Oi, ${esc(a.nome.split(' ')[0])}</p>`)}
  <div class="bandas">${bandas}</div>
  <div class="bloco-t"><div class="pad"><h2 class="t3">outros cursos e guias</h2></div><div class="lista" style="margin-top:1rem">${outros.map(p=>`<a class="linha ir" href="index.html#catalogo" style="--cols:minmax(0,1fr) auto"><span><span class="tit">${esc(p.titulo)}</span><span class="sub">${p.tipo==='curso'?'curso':'guia em pdf'} · ${BRL.format(p.preco)}</span></span>${vai('ver na loja')}</a>`).join('')}</div></div>`;
}
function painelCurso(p){
  const t=TEMAS[p.tema], c=p.tipo==='curso';
  const mods=p.itens.map((m,i)=>{ const v=VISTO.has(p.id+':'+i); return `<div class="aula h ${v?'sel':''}">${gl(m.g)}<span class="tt"><b>${i+1}. ${esc(m.n)}</b>${esc(m.t)}</span><span class="linha-p"><button class="btn peq-b" type="button" data-act="abrir-aula" data-i="${i}">${c?'Assistir':'Ler'}</button><button class="btn peq-b" type="button" data-act="visto" data-i="${i}" aria-pressed="${v}">${v?'visto':'marcar como visto'}</button></span></div>`; }).join('');
  abrirPainel(`
    <div class="p-top"><div><h2 class="p-t">${esc(p.titulo)}</h2><p class="p-s">${c?'curso':'guia em pdf'} · ${visto(p)} de ${p.itens.length} ${c?'módulos vistos':'partes lidas'}</p></div><button class="btn peq-b" type="button" data-act="fechar">Fechar</button></div>
    <p>${esc(p.desc)}</p>
    ${c?'':'<div class="bloco" style="margin-top:1.1rem"><div><button class="btn on" type="button" data-act="baixar">Baixar o pdf</button></div></div>'}
    <div class="bloco"><h3>${c?'módulos':'partes'}</h3><div class="mod-l" style="gap:1.1rem">${mods}</div></div>`, t.bg, t.ink, 'curso:'+p.id);
}
function aAssinatura(){
  const a=A().ass, canc=a.e==='cancelada';
  const cels=MES.map((m,i)=>{
    const t=TEMAS[m.tema], lib=m.status==='publicado';
    if(lib) return `<button class="cm" type="button" data-sel="mes-a" data-id="${i}" aria-pressed="${E.sel==='mes-a:'+i}" style="--bg:${t.bg};--ink:${t.ink}"><span class="marca" aria-hidden="true">${letraSvg(i)}</span><span class="nm">${esc(m.nome)}</span><span class="dt">${fdata(m.data)}</span>${st(MESLIDO.has(i)?'lido':'novo')}</button>`;
    const ag=m.status==='agendado';
    return `<div class="cm sem" style="--bg:${t.bg};--ink:${t.ink}"><span class="marca" aria-hidden="true">${letraSvg(i)}</span><span class="nm">${ag?esc(m.nome):'em breve'}</span><span class="dt">${ag?'sai em '+fdata(m.data):''}</span></div>`;
  }).join('');
  return `${cabecalho('a-assinatura')}
  <div class="pad" style="margin-bottom:1.75rem">
    <p class="lead" style="margin:0"><b>${esc(CFG.assinatura.nome)}</b> · ${st(a.e)}</p>
    <dl class="dados" style="max-width:28rem;margin-top:.9rem"><dt>desde</dt><dd>${fdata(a.desde)} 2026</dd>${canc?'':`<dt>próxima cobrança</dt><dd>9 nov · ${BRL.format(CFG.assinatura.preco)} no ${a.metodo}</dd>`}</dl>
    <div class="linha-p" style="margin-top:1rem"><button class="btn" type="button" data-act="trocar-pg">Trocar forma de pagamento</button><span id="zona-cancel-a">${canc?'<button class="btn" type="button" data-act="reativar">Assinar de novo</button>':'<button class="btn" type="button" data-act="cancelar-a">Cancelar assinatura</button>'}</span></div>
    ${canc?'<p class="nota">Assinatura cancelada. Os meses que você já recebeu continuam disponíveis.</p>':''}
  </div>
  <div class="mg">${cels}</div>`;
}
function painelMesA(i){
  const m=MES[i], t=TEMAS[m.tema], lido=MESLIDO.has(i);
  const arq=m.arquivos.map((x,k)=>`<div class="acesso" style="grid-template-columns:minmax(0,1fr) auto"><span class="tt">${esc(x)}</span><button class="btn peq-b" type="button" data-act="baixar-arq" data-i="${k}">${/pdf/.test(x)?'Baixar':'Assistir'}</button></div>`).join('');
  abrirPainel(`
    <div class="p-top"><div><h2 class="p-t">${esc(m.nome)}</h2><p class="p-s">mês ${i+1} · liberado em ${fdata(m.data)}</p></div><button class="btn peq-b" type="button" data-act="fechar">Fechar</button></div>
    <div class="h" style="--gs:56px;--sw:2.5px">${gl(m.g)}</div>
    <p style="margin-top:1rem">${esc(m.desc)}</p>
    <div class="bloco"><h3>neste mês</h3>${arq}</div>
    <div class="bloco"><div><button class="btn" type="button" data-act="lido" aria-pressed="${lido}">${lido?'lido':'marcar como lido'}</button></div></div>`, t.bg, t.ink, 'mes-a:'+i);
}
function aCompras(){
  const l=PAG.filter(x=>x.pessoa==='p2');
  return `${cabecalho('a-compras')}<div class="lista">
  <div class="linha h0" style="--cols:3.2rem minmax(0,1fr) 5rem 7.5rem auto"><span>data</span><span>produto</span><span class="dir">valor</span><span>situação</span><span></span></div>
  ${l.map(x=>`<div class="linha ir" style="--cols:3.2rem minmax(0,1fr) 5rem 7.5rem auto"><span class="num hm">${fdata(x.data)}</span><span><span class="tit">${esc(nomeProd(x.prod))}</span><span class="sub so-m">${fdata(x.data)} · ${BRL.format(x.valor)}</span></span><span class="dir hm">${BRL.format(x.valor)}</span>${st(x.status)}<button class="btn peq-b hm" type="button" data-act="recibo">Recibo</button></div>`).join('')}</div>`;
}
function aConta(){
  const a=A();
  return `${cabecalho('a-conta')}<div class="aj pad">
    <section><h2>dados</h2>
      <label>Nome<input id="ac-nome" value="${esc(a.nome)}"></label>

    <section><h2>senha</h2>

/* ---------- painel ---------- */
function abrirPainel(html, bg, ink, chave){
  const m=$('#main'), p=$('#painel');
  m.style.setProperty('--pbg',bg); m.style.setProperty('--pink',ink);
  const mudou = E.sel!==chave; const y=p.scrollTop;
  p.innerHTML=html; p.hidden=false; p.scrollTop = mudou?0:y;
  m.classList.add('com-painel');
  E.sel=chave;
  $$('[aria-selected]').forEach(b=>b.setAttribute('aria-selected', b.dataset.sel && (b.dataset.sel+':'+b.dataset.id)===chave));
  $$('.cm[data-sel]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.sel+':'+b.dataset.id===chave));
  if(mudou) p.focus({preventScroll:true});
}
function fecharPainel(mudando){
  const m=$('#main'), p=$('#painel'); const antes=E.sel;
  p.hidden=true; p.innerHTML=''; m.classList.remove('com-painel'); E.sel=null;
  if(mudando) return;
  $$('[aria-selected]').forEach(b=>b.setAttribute('aria-selected','false'));
  $$('.cm[data-sel]').forEach(b=>b.setAttribute('aria-pressed','false'));
  if(antes){ const [t,id]=antes.split(':'); const b=$(`[data-sel="${t}"][data-id="${id}"]`); if(b) b.focus({preventScroll:true}); }
}
function selecionar(tipo,id){
  if(tipo==='produto') painelProduto(PROD.find(p=>p.id===id));
  if(tipo==='mes') painelMes(+id);
  if(tipo==='pessoa') painelPessoa(pessoa(id));
  if(tipo==='pag') painelPag(PAG.find(x=>x.id===id));
  if(tipo==='curso') painelCurso(PROD.find(p=>p.id===id));
  if(tipo==='mes-a') painelMesA(+id);
}
function refrescaTela(){ const y=window.scrollY; renderTela(); window.scrollTo(0,y); }
function atualizaLista(){
  const l=$('#lista'); if(!l) return;
  l.innerHTML = ({produtos:linhasProdutos,pessoas:linhasPessoas,pagamentos:linhasPag})[E.tela]();
}
function atualizaMeses(){
  const t=$('#tela'); const y=window.scrollY; renderTela(); window.scrollTo(0,y);
  if(E.sel&&E.sel.startsWith('mes:')){ const b=$(`.cm[data-id="${E.sel.split(':')[1]}"]`); if(b) b.setAttribute('aria-pressed','true'); }
}

/* ---------- menu no celular ---------- */
function fecharMenu(){ $('#lado').classList.remove('on'); $('#abrir-menu').setAttribute('aria-expanded','false'); }

/* ---------- eventos ---------- */
document.addEventListener('click', e=>{
  const t=e.target;
  let b;
  if((b=t.closest('[data-ir]'))){
    let o={};
    try{ if(b.dataset.f) o.f=JSON.parse(b.dataset.f); if(b.dataset.sel) o.sel=JSON.parse(b.dataset.sel); }catch(x){}
    if(b.dataset.ir==='produtos'&&o.sel) o.sel=['produto',o.sel[1]];
    ir(b.dataset.ir,o); return;
  }
  if((b=t.closest('[data-fp]'))){ E.fp=b.dataset.fp; $$('[data-fp]').forEach(x=>x.setAttribute('aria-pressed',x===b)); atualizaLista(); return; }
  if((b=t.closest('[data-fg]'))){ E.fg=b.dataset.fg; $$('[data-fg]').forEach(x=>x.setAttribute('aria-pressed',x===b)); atualizaLista(); return; }
  if((b=t.closest('[data-sel]'))){ selecionar(b.dataset.sel,b.dataset.id); return; }
  if((b=t.closest('[data-novo]'))){
    const n={id:'novo-'+Date.now(),tipo:'curso',tema:'letr',titulo:'novo produto',preco:0,link:'',desc:'',status:'rascunho',vendas:0,itens:[]};
    PROD.unshift(n); atualizaLista(); painelProduto(n); aviso('Produto criado como rascunho. Ele só aparece na loja quando você publicar.'); return;
  }
  if((b=t.closest('[data-act]'))) acao(b.dataset.act,b);
});

function acao(a,b){
  const sel=E.sel||''; const [tp,id]=sel.split(':');
  const p = tp==='produto'?PROD.find(x=>x.id===id):null;
  const m = tp==='mes'?MES[+id]:null;
  const pe = tp==='pessoa'?pessoa(id):null;
  const pg = tp==='pag'?PAG.find(x=>x.id===id):null;
  const cu = tp==='curso'?PROD.find(x=>x.id===id):null;
  const ma = tp==='mes-a'?MES[+id]:null;
  if(a==='fechar') return fecharPainel();
  if(p){
    const i=+b.dataset.i;
    if(a==='sobe'&&i>0){ [p.itens[i-1],p.itens[i]]=[p.itens[i],p.itens[i-1]]; painelProduto(p); atualizaLista(); }
    if(a==='desce'&&i<p.itens.length-1){ [p.itens[i+1],p.itens[i]]=[p.itens[i],p.itens[i+1]]; painelProduto(p); atualizaLista(); }
    if(a==='tira'){ p.itens.splice(i,1); painelProduto(p); atualizaLista(); }
    if(a==='add-mod'){ const k=$('#pick'); k.hidden=!k.hidden; }
    if(a==='forma'){ p.itens.push({g:b.dataset.g,n:'novo módulo',t:''}); painelProduto(p); atualizaLista(); }
    if(a==='salvar'){ aviso('Salvo. A loja já mostra a mudança (exemplo).'); }
  }
  if(m){
    if(a==='tira-arq'){ m.arquivos.splice(+b.dataset.i,1); painelMes(+id); }
    if(a==='add-arq'){ $('#arq').click(); }
    if(a==='salvar-mes'){ atualizaMeses(); aviso('Salvo. Quem assina recebe o mês na data de liberação (exemplo).'); }
  }
  if(pe){
    if(a==='acesso'){ const k=b.dataset.id; if(pe.acessos.has(k)){ pe.acessos.delete(k); aviso('Acesso removido (exemplo).'); } else { pe.acessos.add(k); aviso('Acesso liberado. A pessoa recebe um e-mail (exemplo).'); } painelPessoa(pe); }
    if(a==='reenviar') aviso('E-mail de acesso reenviado para '+pe.email+' (exemplo).');
    if(a==='senha') aviso('A pessoa recebe um link para criar outra senha (exemplo).');
    if(a==='cancelar'){ $('#zona-cancel').innerHTML='<div class="conf"><p>Cancelar a assinatura de '+esc(pe.nome)+'? Os módulos já recebidos continuam disponíveis.</p><div class="linha-p"><button class="btn on" type="button" data-act="cancelar-sim">Confirmar cancelamento</button><button class="btn" type="button" data-act="cancelar-nao">Voltar</button></div></div>'; }
    if(a==='cancelar-nao') painelPessoa(pe);
    if(a==='cancelar-sim'){ pe.ass.e='cancelada'; pe.ass.canc=HOJE; painelPessoa(pe); atualizaLista(); aviso('Assinatura cancelada (exemplo).'); }
  }
  if(pg){
    if(a==='ver-pessoa') ir('pessoas',{sel:['pessoa',b.dataset.id]});
    if(a==='reenviar') aviso('E-mail de acesso reenviado (exemplo).');
    if(a==='reembolsar'){ $('#zona-reemb').innerHTML='<div class="conf"><p>Reembolsar '+BRL.format(pg.valor)+' para '+esc(pessoa(pg.pessoa).nome)+'? O acesso a este produto é removido.</p><div class="linha-p"><button class="btn on" type="button" data-act="reemb-sim">Confirmar reembolso</button><button class="btn" type="button" data-act="reemb-nao">Voltar</button></div></div>'; }
    if(a==='reemb-nao') painelPag(pg);
    if(a==='reemb-sim'){ pg.status='reembolsado'; const q=pessoa(pg.pessoa); q.acessos.delete(pg.prod); painelPag(pg); atualizaLista(); renderNav(); aviso('Reembolso pedido ao Mercado Pago (exemplo).'); }
  }
  if(cu){
    const i=+b.dataset.i, k=cu.id+':'+i;
    if(a==='visto'){ VISTO.has(k)?VISTO.delete(k):VISTO.add(k); painelCurso(cu); refrescaTela(); }
    if(a==='abrir-aula') aviso('Aqui abre '+(cu.tipo==='curso'?'a aula em vídeo':'o texto')+' (exemplo).');
    if(a==='baixar') aviso('O download do pdf começa aqui (exemplo).');
  }
  if(ma){
    if(a==='lido'){ MESLIDO.has(+id)?MESLIDO.delete(+id):MESLIDO.add(+id); painelMesA(+id); refrescaTela(); }
    if(a==='baixar-arq') aviso('O arquivo abre ou baixa aqui (exemplo).');
  }
  if(a==='trocar-pg') aviso('Abre a página do Mercado Pago para escolher outro cartão ou pix (exemplo).');
  if(a==='cancelar-a'){ $('#zona-cancel-a').innerHTML='<span class="conf"><span>Cancelar a assinatura? Os meses já recebidos continuam disponíveis.</span><span class="linha-p"><button class="btn on" type="button" data-act="cancelar-a-sim">Confirmar cancelamento</button><button class="btn" type="button" data-act="cancelar-a-nao">Voltar</button></span></span>'; }
  if(a==='cancelar-a-nao') refrescaTela();
  if(a==='cancelar-a-sim'){ A().ass.e='cancelada'; A().ass.canc=HOJE; A().acessos.delete('assinatura'); refrescaTela(); aviso('Assinatura cancelada (exemplo).'); }
  if(a==='reativar'){ A().ass.e='ativa'; delete A().ass.canc; A().acessos.add('assinatura'); refrescaTela(); aviso('Assinatura reativada (exemplo).'); }
  if(a==='recibo') aviso('O recibo chega por e-mail (exemplo).');
  if(a==='salvar-conta') aviso('Dados salvos (exemplo).');
  if(a==='trocar-senha'){ const v=$('#ac-senha').value; if(v.length<8){ aviso('A senha precisa ter pelo menos 8 caracteres.'); return; } $('#ac-senha').value=''; aviso('Senha trocada (exemplo).'); }
  if(a==='salvar-aj'){ const n=$('#aj-nome').value.trim(), v=+$('#aj-preco').value; if(!n||!(v>=0)){ aviso('Preencha o nome e um preço válido.'); return; } CFG.assinatura.nome=n; CFG.assinatura.preco=v; aviso('Salvo. A loja mostra o novo nome e preço (exemplo).'); }
  if(a==='copiar'){ const v=$('#wh').value; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>aviso('Endereço copiado.')).catch(()=>{ $('#wh').select(); aviso('Selecionei o endereço. Copie com Ctrl+C.'); }); }
  if(a==='forma-pg'){ b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')!=='true'); }
  if(a==='convidar') aviso('O convite sai por e-mail, com o perfil escolhido (exemplo).');
  if(a==='salvar-em') aviso('Mensagem salva (exemplo).');
}

document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='busca'){ E.busca=t.value; atualizaLista(); return; }
  const sel=E.sel||''; const [tp,id]=sel.split(':');
  if(t.dataset.bind && tp==='produto'){
    const p=PROD.find(x=>x.id===id); const k=t.dataset.bind;
    p[k] = k==='preco' ? Math.max(0,+t.value||0) : t.value;
    if(t.tagName==='SELECT' && k==='tema'){ p.tema=t.value; painelProduto(p); }
    else if(t.tagName==='SELECT' && k==='tipo'){ painelProduto(p); }
    atualizaLista();
  }
  if(t.dataset.bind && tp==='mes'){
    const m=MES[+id]; const k=t.dataset.bind; m[k]=t.value;
    if(k==='tema'||k==='status') painelMes(+id);
  }
  if(t.dataset.mod!==undefined && tp==='produto'){
    PROD.find(x=>x.id===id).itens[+t.dataset.mod][t.dataset.campo]=t.value; atualizaLista();
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='arq' && e.target.files[0]){
    const sel=E.sel||''; const [tp,id]=sel.split(':');
    if(tp==='mes'){ MES[+id].arquivos.push(e.target.files[0].name); painelMes(+id); aviso('Arquivo adicionado à lista (exemplo, nada foi enviado).'); }
  }
  if(e.target.id==='perfil'){
    const v=e.target.value, antes=perfil(), agora = v==='dona'?'adm':v;
    document.body.dataset.perfil=agora;
    if(antes==='aluna' || agora==='aluna') ir(Object.keys(telasDe())[0]);
    else if(agora==='op' && E.tela==='ajustes') ir('visao');
    else { const s=E.sel; renderNav(); renderTela(); if(s){ const [t,i]=s.split(':'); selecionar(t,i); } }
    aviso({adm:'Agora você vê como a Cíntia: administradora.', dona:'Agora você vê como a Preta Letrada: o mesmo acesso da administradora.', op:'Agora você vê como a Maria: sem valores recebidos e sem ajustes.', aluna:'Agora você vê como a Bruna, aluna: só os cursos, a assinatura e as compras dela.'}[v]);
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#lado').classList.contains('on')) fecharMenu(); else if(!$('#painel').hidden) fecharPainel(); } });
$('#veu').addEventListener('click',()=>fecharPainel());
$('#abrir-menu').addEventListener('click',()=>{ const on=$('#lado').classList.toggle('on'); $('#abrir-menu').setAttribute('aria-expanded',on); });

/* tema claro e escuro */
(function(){
  const root=document.documentElement, btn=$('#tema');
  try{ const s=localStorage.getItem('pl-tema'); if(s==='light'||s==='dark') root.dataset.theme=s; }catch(e){}
  const atual=()=> root.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  const rot=()=>{ btn.textContent = atual()==='dark' ? 'Usar tema claro' : 'Usar tema escuro'; };
  rot();
  btn.addEventListener('click',()=>{ const novo=atual()==='dark'?'light':'dark'; root.dataset.theme=novo; try{ localStorage.setItem('pl-tema',novo); }catch(e){} rot(); });
})();

/* entrar e sair */
function entrar(){
  $('#login').hidden=true; $('#app').hidden=false;
  try{ sessionStorage.setItem('pl-admin','1'); }catch(e){}
  const h=(location.hash||'').slice(1);
  ir(telasDe()[h]?h:Object.keys(telasDe())[0]);
}
$('#form-login').addEventListener('submit',e=>{ e.preventDefault(); entrar(); });
$('#esqueci').addEventListener('click',()=>aviso('A pessoa recebe um link por e-mail para criar outra senha (exemplo).'));
$('#sair').addEventListener('click',()=>{
  try{ sessionStorage.removeItem('pl-admin'); }catch(e){}
  fecharPainel(true); fecharMenu(); $('#app').hidden=true; $('#login').hidden=false; $('#lg-email').focus();
});

/* início */
document.body.dataset.perfil='adm';
$('#logo-lado').innerHTML=marca(); $('#logo-m').innerHTML=marca(); $('#logo-login').innerHTML=marca();
kin($('#h-login'));
renderNav();
let logado=false; try{ logado=sessionStorage.getItem('pl-admin')==='1'; }catch(e){}
if(logado){ $('#login').hidden=true; entrar(); } else { $('#app').hidden=true; }
